# Typecheck, lint, layer rules and tests on every push and pull request. macOS, like the target:
# the tests use fakes for the sound card and models, so no audio device or model download is needed.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
